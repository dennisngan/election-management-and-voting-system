# 1. Copy this file to config.yml. Edit the settings below.
# 2. docker compose -f config.yml up -d --build
# config.yml contains temporary passwords and is excluded from Git.
name: election-server

x-election:
  server:
    host: localhost                    # Certificate hostname/IP used by desktop clients
    bind: &server_bind 127.0.0.1        # Use a private interface for LAN/VPN access
    port: &server_port 8443
  storage:
    mysql: &mysql_data ./data/mysql     # Persistent DATABASE directory on this machine
  accounts:                            # Initial creation only; existing accounts are preserved
    # Use $$ for a literal dollar in a password (standard Compose escaping).
    - username: admin
      display_name: Administrator
      role: administrator
      password: CHANGE_ME_TO_A_UNIQUE_TEMPORARY_PASSWORD
    # - username: supervisor
    #   display_name: Supervisor
    #   role: supervisor
    #   password: CHANGE_ME_TO_ANOTHER_TEMPORARY_PASSWORD

# No settings below this line need editing.
x-image: &image
  image: election-server:local
  build:
    context: .
    dockerfile: deploy/Dockerfile

services:
  configure:
    <<: *image
    user: "0:0"
    entrypoint: [python, -m, election.deployment.quickstart, prepare]
    volumes:
      - type: bind
        source: ./config.yml
        target: /config.yml
        read_only: true
        bind: {create_host_path: false}
      - bootstrap:/bootstrap
      - runtime:/run/election
      - database-secrets:/db-secrets
      - backups:/var/lib/election/backups

      - type: bind
        source: *mysql_data
        target: /mysql-data
        read_only: true

  db:
    image: mysql:8.4@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
    restart: unless-stopped
    depends_on:
      configure: {condition: service_completed_successfully}
    environment:
      MYSQL_DATABASE: election
      MYSQL_USER: election
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/root-password
      MYSQL_PASSWORD_FILE: /run/secrets/app-password
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    volumes:
      - type: bind
        source: *mysql_data
        target: /var/lib/mysql
      - database-secrets:/run/secrets:ro
    healthcheck:
      test: [CMD, mysql, --defaults-extra-file=/run/secrets/health.cnf, --execute=SELECT 1]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 20s

  initialize:
    <<: *image
    user: "0:0"
    entrypoint: [python, -m, election.deployment.quickstart, initialize]
    depends_on:
      db: {condition: service_healthy}
    volumes:
      - type: bind
        source: ./config.yml
        target: /config.yml
        read_only: true
        bind: {create_host_path: false}
      - runtime:/run/election
      - backups:/var/lib/election/backups

  api:
    <<: *image
    restart: unless-stopped
    depends_on:
      initialize: {condition: service_completed_successfully}
    environment:
      ELECTION_ENV_FILE: /run/election/server.env
    ports:
      - target: 8443
        published: *server_port
        host_ip: *server_bind
    volumes:
      - runtime:/run/election:ro
      - backups:/var/lib/election/backups
    healthcheck:
      test: [CMD, python, -m, election.deployment, health]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  admin:
    <<: *image
    profiles: [tools]
    user: "0:0"
    entrypoint: [python, -m, election.deployment]
    command: [status]
    environment:
      ELECTION_ENV_FILE: /run/election/server.env
      ELECTION_MYSQL_ROOT_PASSWORD_FILE: /run/election/admin-secrets/root-password
    volumes:
      - runtime:/run/election
      - database-secrets:/run/election/admin-secrets:ro
      - backups:/var/lib/election/backups

volumes:
  bootstrap:
  runtime:
  database-secrets:
  backups:
