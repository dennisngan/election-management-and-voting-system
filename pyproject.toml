[project]
name = "election-management-voting-system"
version = "0.1.0"
description = "Staff desktop application for physical-ballot election operations"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
server = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "pymysql",
    "alembic",
    "pydantic-settings",
    "argon2-cffi",
    "cryptography",
    "pyyaml",
]
desktop = ["pyside6"]
reports = ["reportlab"]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
    "ruff",
    "mypy",
    "types-PyMySQL",
    "types-PyYAML",
    "pypdf>=6.21.2",
]
gui-validation = ["pyinstaller; sys_platform == 'darwin' or sys_platform == 'win32'"]

[tool.uv]
package = false
default-groups = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
files = ["src/election"]
strict = true
plugins = ["pydantic.mypy"]
