[project]
name = "election-desk"
version = "1.0.0"
description = "Election Desk desktop application for physical-ballot election operations"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
server = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "pymysql",
    "alembic",
    "pydantic-settings",
    "argon2-cffi",
    "cryptography",
    "pyyaml",
]
desktop = ["pyside6", "pydantic", "tzdata"]
reports = ["reportlab"]
dev = [
    "ruff",
    "mypy",
    "types-PyMySQL",
    "types-PyYAML",
]
build = ["pyinstaller", "pillow"]

[tool.uv]
package = false
default-groups = "all"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4"]

[tool.ruff.lint.per-file-ignores]
# These Windows-only attributes are resolved dynamically for portable type checking.
"src/election/private_paths.py" = ["B009"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
files = ["src/election"]
strict = true
plugins = ["pydantic.mypy"]
